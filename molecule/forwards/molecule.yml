---
# Forward-zone lifecycle: add, prove, remove, prove, re-add. Separate from
# `default` because removing and re-creating a file changes on every run, so
# `idempotence` is deliberately absent from test_sequence below. One image:
# this exercises role logic, not OS variance.
dependency:
  name: shell
  command: "true"

driver:
  name: docker

platforms:
  - name: "anxs-unbound-forwards-${MOLECULE_OS:-ubuntu}-${MOLECULE_VERSION:-2404}"
    image: "${MOLECULE_IMAGE:-geerlingguy/docker-ubuntu2404-ansible:latest}"
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    privileged: true
    pre_build_image: true
    cgroupns_mode: host
    command: ${MOLECULE_DOCKER_COMMAND:-""}

provisioner:
  name: ansible
  config_options:
    defaults:
      remote_tmp: /tmp/.ansible-${USER}/tmp/
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/..:${HOME}/.ansible/roles"

# No `cleanup` step -- see molecule/default/molecule.yml. No `idempotence`
# step either; that is why this scenario is separate.
scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - destroy
