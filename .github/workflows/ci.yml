---
name: Molecule CI

'on':
  pull_request:
    branches:
      - "master"
      - "main"
  push:
    branches:
      - "master"
      - "main"
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run lint
        run: make lint

  # Keep this matrix identical to test-all in the Makefile. Debian 11 is
  # absent on purpose: it is past end of life.
  test:
    name: Test (${{ matrix.os }}-${{ matrix.version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: debian
            version: '12'
            image: geerlingguy/docker-debian12-ansible:latest
          - os: debian
            version: '13'
            image: geerlingguy/docker-debian13-ansible:latest
          - os: ubuntu
            version: '2004'
            image: geerlingguy/docker-ubuntu2004-ansible:latest
          - os: ubuntu
            version: '2204'
            image: geerlingguy/docker-ubuntu2204-ansible:latest
          - os: ubuntu
            version: '2404'
            image: geerlingguy/docker-ubuntu2404-ansible:latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run molecule test
        run: molecule test
        env:
          MOLECULE_OS: ${{ matrix.os }}
          MOLECULE_VERSION: ${{ matrix.version }}
          MOLECULE_IMAGE: ${{ matrix.image }}

  # Forward-zone lifecycle -- one image; see the Makefile's test-forwards.
  forwards:
    name: Forward zone lifecycle
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run molecule test
        run: molecule test -s forwards
        env:
          MOLECULE_OS: ubuntu
          MOLECULE_VERSION: '2404'
          MOLECULE_IMAGE: geerlingguy/docker-ubuntu2404-ansible:latest
